# Early-start GRPO from the SFT step-1,000 checkpoint, seed 1.
run: grpo_early_s1
init: sft/step_01000
seed: 1
iters: 300
prompts_per_step: 16
group_size: 8
temperature: 1.0
max_new: 64
epochs: 2
minibatch: 64
lr: 1.0e-5
warmup: 5
clip_eps: 0.2
beta: 0.04
grad_clip: 1.0
w_correct: 1.0
w_format: 0.1
eval_every: 50
eval_samples: 4
